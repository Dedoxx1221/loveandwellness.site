<!-- FONTE -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    padding:0;
    font-family: 'Montserrat', Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    background: radial-gradient(circle at center, #7a0000 0%, #5a0000 40%, #2b0000 75%, #120000 100%);
    color:#fff;
  }

  /* impedir seleção */
  .no-select{
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
  }

  .container{
    width:92%;
    max-width:420px;
    text-align:center;
    padding:40px 0; /* empurra mais pra baixo */
  }

  .hero-img{
    display:block;
    width:100%;
    max-width:100%;
    max-height:420px;
    height:auto;
    object-fit:contain;
    border-radius:12px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.6);
    margin:25px 0; /* respiro acima e abaixo */
  }

  .headline{
    font-size:26px;
    font-weight:700;
    margin-bottom:12px;
    line-height:1.3;
  }

  .headline span{
    color:#ff2a2a; /* destaque apenas no 18 */
  }

  .sub{
    font-size:15px;
    opacity:0.95;
    line-height:1.5;
  }

  .cta{
    margin-top:30px;
    display:flex;
    justify-content:center;
  }

  /* botão */
  .btn-ver {
    width:60%;
    background: linear-gradient(180deg, #ff1a1a, #cc0000);
    color: #ffffff;
    font-weight: 700;
    font-size: 17px;
    text-align: center;
    padding: 16px 20px;
    border-radius: 12px;
    text-decoration: none;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .btn-ver:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45);
  }
</style>

</head>
<body>

<div class="container">

  <!-- IMAGEM -->
  <a href="https://loveandwellness.site/vsesp/">
    <img src="foto_coelho2" class="hero-img">
  </a>

  <!-- TEXTO -->
  <div class="no-select">
    <div class="headline">¿Tienes más de <span>18 años</span>?</div>
    <div class="sub">
      Haz clic en el botón de abajo si eres mayor de edad y deseas ver la presentación completa.
    </div>
  </div>

  <!-- BOTÃO -->
  <div class="cta">
    <a href="https://loveandwellness.site/vsesp/" class="btn-ver">¡VER AHORA!</a>
  </div>

</div>


</body></html>
