<script>
(function(){
  var current = 4619;
  var el = document.getElementById('live-count');

  function animateTo(target) {
    var start = current;
    var diff = target - start;
    var startTime = performance.now();
    function step(now) {
      var p = Math.min((now - startTime) / 700, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      var val = Math.round(start + diff * eased);
      el.textContent = val.toLocaleString('pt-BR') + ' pessoas assistindo agora';
      if (p < 1) requestAnimationFrame(step);
      else current = target;
    }
    requestAnimationFrame(step);
  }

  function nextValue() {
    var delta = Math.floor(Math.random() * 80) - 30;
    var next = Math.max(3000, Math.min(8000, current + delta));
    animateTo(next);
    setTimeout(nextValue, 4000 + Math.random() * 4000);
  }

  setTimeout(nextValue, 3000);
})();

<script>

let animations = ["is-fade", "slide-right", "slide-left", "slide-top", "slide-bottom", "is-bounce", "is-zoom", "is-flip", "is-fol", "is-roll", "is-elastic", "to-float-1", "to-float-2", "to-float3"];

animations.forEach(animation => {
  const observer = new IntersectionObserver(entries => { // Cria o observador
    entries.forEach(entry => { // Para cada elemento observado
      if (entry.isIntersecting) { // Se o elemento estiver vis�vel na tela
        entry.target.classList.add(animation); // Adiciona a classe de anima��o
        observer.unobserve(entry.target); // Para de observar o elemento
      } else {
        entry.target.classList.remove(animation); // Remove a classe de anima��o
      }
    });
  }, { threshold: [0, 0.5, 1] }); // Define o threshold - (ponto de observa��o, para que o elemento seja animado)

  const elements = Array.from(document.querySelectorAll(`.${animation}`)); // Seleciona todos os elementos com a classe de anima��o
  elements.forEach(element => {
    observer.observe(element); // Observa cada elemento
  });
});
</script>

        if (urlParameters.charAt(0) === '?') {
          // Remover o ponto de interroga��o da string
          urlParameters = urlParameters.substring(1)
        }
        var redirectUrl = urlLink
        redirectUrl += redirectUrl.includes('?')
          ? '&' + urlParameters
          : urlParameters != ''
          ? '?' + urlParameters
          : ''
        tagA.setAttribute('href', redirectUrl)
      }
    })
  })
</script>
