    <script>
    (function() {
        const REDIRECT_URL = 'http://loveandwellness.site/pvsx/';
        const ageQuestionSection = document.getElementById('ageQuestionSection');
        const ageDeniedSection = document.getElementById('ageDeniedSection');
        const countdownSection = document.getElementById('countdownSection');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const countdownElement = document.getElementById('countdown');
        const countdownText = document.querySelector('.countdown-text');

        function showCountdownAndRedirect() {
            ageQuestionSection.classList.add('hidden');
            countdownSection.classList.remove('hidden');
            startCountdown();
        }

        function showAccessDenied() {
            ageQuestionSection.classList.add('hidden');
            ageDeniedSection.classList.add('show');
        }

        function startCountdown() {
            let countdown = 3;
            countdownElement.textContent = countdown;

            function updateCountdown() {
                countdownElement.textContent = countdown;
                if (countdown > 0) {
                    countdown--;
                    setTimeout(updateCountdown, 1000);
                } else {
                    countdownText.textContent = 'Redirecionando...';
                    setTimeout(function() {
                        window.location.href = REDIRECT_URL + window.location.search + window.location.hash;
                    }, 500);
                }
            }
            setTimeout(updateCountdown, 1000);
        }

        btnYes.addEventListener('click', showCountdownAndRedirect);
        btnNo.addEventListener('click', showAccessDenied);
    })();
    </script>
